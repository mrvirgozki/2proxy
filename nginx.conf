worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 0;

    server {
        listen 127.0.0.1:8084;
        server_name localhost;

        # ----------------------------------------------------------------------
        # WEB FRONTEND / HEALTH CHECK
        # ----------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        # ----------------------------------------------------------------------
        # WEBSOCKET (WS) LOCATIONS (Mapped to Xray Ports 10000, 10003, 10006, 10009)
        # ----------------------------------------------------------------------
        location /virgozki {
            proxy_pass http://127.0.0.1:10000; # Trojan WS
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /vmess-virgozki {
            proxy_pass http://127.0.0.1:10003; # VMess WS
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /vless-virgozki {
            proxy_pass http://127.0.0.1:10006; # VLess WS
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /ss-virgozki {
            proxy_pass http://127.0.0.1:10009; # Shadowsocks WS
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # HTTPUPGRADE (HU) LOCATIONS (Mapped to Xray Ports 10001, 10004, 10007, 10010)
        # ----------------------------------------------------------------------
        location /virgozki-hu {
            proxy_pass http://127.0.0.1:10001; # Trojan HU
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /vmess-virgozki-hu {
            proxy_pass http://127.0.0.1:10004; # VMess HU
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /vless-virgozki-hu {
            proxy_pass http://127.0.0.1:10007; # VLess HU
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /ss-virgozki-hu {
            proxy_pass http://127.0.0.1:10010; # Shadowsocks HU
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # XHTTP LOCATIONS (Mapped to Xray Ports 10002, 10005, 10008, 10011)
        # ----------------------------------------------------------------------
        location /virgozki-xhttp {
            proxy_pass http://127.0.0.1:10002; # Trojan XHTTP
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_socket_keepalive on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        location /vmess-virgozki-xhttp {
            proxy_pass http://127.0.0.1:10005; # VMess XHTTP
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_socket_keepalive on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        location /vless-virgozki-xhttp {
            proxy_pass http://127.0.0.1:10008; # VLess XHTTP
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_socket_keepalive on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        location /ss-virgozki-xhttp {
            proxy_pass http://127.0.0.1:10011; # Shadowsocks XHTTP
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_socket_keepalive on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        # ----------------------------------------------------------------------
        # gRPC LOCATIONS (Mapped to Xray Ports 10012, 10013, 10014, 10015)
        # ----------------------------------------------------------------------
        location /vless-grpc-virgozki {
            grpc_pass grpc://127.0.0.1:10012; # VLess gRPC
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /vmess-grpc-virgozki {
            grpc_pass grpc://127.0.0.1:10013; # VMess gRPC
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /trojan-grpc-virgozki {
            grpc_pass grpc://127.0.0.1:10014; # Trojan gRPC
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ss-grpc-virgozki {
            grpc_pass grpc://127.0.0.1:10015; # Shadowsocks gRPC
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
