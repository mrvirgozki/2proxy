worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    server {
        # Port na ginagamit ng OpenResty/Nginx
        listen 127.0.0.1:8084;
        server_name localhost;

        # ----------------------------------------------------------------------
        # WEB FRONTEND / HEALTH CHECK
        # ----------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        # ----------------------------------------------------------------------
        # XHTTP LOCATIONS (Pang-solusyon sa 400 Bad Request at 504 Timeout)
        # ----------------------------------------------------------------------
        location ~ ^/(vless-virgozki-xhttp|vmess-virgozki-xhttp|virgozki-xhttp|ss-virgozki-xhttp)(.*)$ {
            proxy_pass http://127.0.0.1:10001; # Baguhin ang port base sa Xray port mo
            proxy_http_version 1.1;

            # KRITIKAL PARA SA XHTTP: Off ang buffering at chunking
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding off;

            # Timeout prevention
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        # ----------------------------------------------------------------------
        # WEBSOCKET (WS) LOCATIONS
        # ----------------------------------------------------------------------
        location ~ ^/(vless-virgozki|vmess-virgozki|virgozki|ss-virgozki)$ {
            proxy_pass http://127.0.0.1:10001; # Baguhin ang port base sa Xray port mo
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------------------------
        # HTTPUPGRADE (HU) LOCATIONS
        # ----------------------------------------------------------------------
        location ~ ^/(vless-virgozki-hu|vmess-virgozki-hu|virgozki-hu|ss-virgozki-hu)$ {
            proxy_pass http://127.0.0.1:10001; # Baguhin ang port base sa Xray port mo
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------------------------
        # gRPC LOCATIONS
        # ----------------------------------------------------------------------
        location ~ ^/(vless-grpc-virgozki|vmess-grpc-virgozki|trojan-grpc-virgozki|ss-grpc-virgozki) {
            proxy_pass grpc://127.0.0.1:10001; # Baguhin ang port base sa Xray port mo
            
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
